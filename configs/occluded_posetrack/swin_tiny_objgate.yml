# TARDIS 对照配置：在 occluded_posetrack/swin_tiny.yml 基线之上，仅翻开 OBJGATE 与 MIX 开关
# （单变量：相对基线只多了门控 + 去偏合成监督，其余超参完全一致）
MODEL:
  PRETRAIN_HW_RATIO: 2
  METRIC_LOSS_TYPE: 'triplet'
  IF_LABELSMOOTH: 'off'
  IF_WITH_CENTER: 'no'
  NAME: 'transformer'
  NO_MARGIN: True
  DEVICE_ID: ('0')
  TRANSFORMER_TYPE: 'swin_tiny_patch4_window7_224'
  STRIDE_SIZE: [16, 16]

INPUT:
  SIZE_TRAIN: [384, 128]
  SIZE_TEST: [384, 128]
  PROB: 0.5
  RE_PROB: 0.5
  PADDING: 10
  PIXEL_MEAN: [0.5, 0.5, 0.5]
  PIXEL_STD: [0.5, 0.5, 0.5]
  MIX_PROB: 0.5
  MIX_RATIO_RANGE: [0.3, 0.7]
  MIX_TYPE: 'both'

DATASETS:
  NAMES: ('occluded_posetrack')
  ROOT_DIR: ('/root/reid-clean/data')

DATALOADER:
  SAMPLER: 'softmax_triplet'
  NUM_INSTANCE: 4
  NUM_WORKERS: 8

SOLVER:
  OPTIMIZER_NAME: 'SGD'
  MAX_EPOCHS: 120
  BASE_LR: 0.0008
  WARMUP_EPOCHS: 20
  IMS_PER_BATCH: 64
  WARMUP_METHOD: 'cosine'
  LARGE_FC_LR: False
  CHECKPOINT_PERIOD: 120
  LOG_PERIOD: 20
  EVAL_PERIOD: 20
  WEIGHT_DECAY:  1e-4
  WEIGHT_DECAY_BIAS: 1e-4
  BIAS_LR_FACTOR: 2

TEST:
  EVAL: True
  IMS_PER_BATCH: 64
  RE_RANKING: False
  WEIGHT: ''
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'

OBJGATE:
  ENABLED: True
  HIDDEN: 192
  TAU: 1.0
  LAMBDA_TARGET: 1.0
  LAMBDA_WARMUP_EPOCHS: 10
  FEATMAP_INDEX: -1
  SPLIT_W: 1.0
  ANTI_W: 0.1
  ENTROPY_MIN: 0.7
  ENTROPY_MAX: 3.0

OUTPUT_DIR: './log/occluded_posetrack/swin_tiny_objgate'
