MODEL:
  PRETRAIN_HW_RATIO: 2
  PRETRAIN_PATH: 'pretrained/swin_tiny.pth'
  PRETRAIN_CHOICE: 'self'
  METRIC_LOSS_TYPE: 'triplet'
  IF_LABELSMOOTH: 'off'
  IF_WITH_CENTER: 'no'
  NAME: 'transformer'
  NO_MARGIN: True
  DEVICE_ID: ('0')
  COS_LAYER: False
  TRANSFORMER_TYPE: 'swin_tiny_patch4_window7_224'
  STRIDE_SIZE: [16, 16]
  DROP_PATH: 0.1
  SEMANTIC_WEIGHT: 0.2
  WITH_CP: False
  POSE_ENABLED: True
  POSE_DATA_DIR: 'data/occluded_duke'
  POSE_BACKBONE_PSG: True
  POSE_HEATMAP_SIZE: [96, 32]
  POSE_PFM_HIDDEN: 64
  POSE_SKELETON_GCN: True
  POSE_GCN_LAYERS: 2
  POSE_GCN_HIDDEN: 256
  POSE_TEST_FEAT: 'concat_scaled'
  POSE_CSRD: True
  POSE_CSRD_WEIGHT: 0.5
  POSE_CSRD_WARMUP: 20
  POSE_CSRD_TAU: 0.10
  POSE_CSRD_SUPPORT_TEACHER: True
  POSE_CSRD_ST_LOW_THR: 0.3
  POSE_CSRD_ST_UPDATE_THR: 0.7
  POSE_CSRD_ST_MOM: 0.9
  POSE_CSRD_ST_MIN_COUNT: 1
  POSE_CSRD_ST_UPDATE_STOP_EPOCH: -1
  POSE_CSRD_PAIR_WEIGHT_MODE: 'delta_top'
  POSE_CSRD_PAIR_WEIGHT_ALPHA: 1.0
  POSE_CSRD_PAIR_TOP_RATIO: 0.25

INPUT:
  SIZE_TRAIN: [384, 128]
  SIZE_TEST: [384, 128]
  PROB: 0.5
  RE_PROB: 0.5
  PIXEL_MEAN: [0.5, 0.5, 0.5]
  PIXEL_STD: [0.5, 0.5, 0.5]
  PADDING: 10

DATASETS:
  NAMES: ('occluded_duke')
  ROOT_DIR: ('data')

DATALOADER:
  SAMPLER: 'softmax_triplet'
  NUM_INSTANCE: 4
  NUM_WORKERS: 8

SOLVER:
  OPTIMIZER_NAME: 'SGD'
  MAX_EPOCHS: 120
  BASE_LR: 0.0008
  WARMUP_EPOCHS: 20
  IMS_PER_BATCH: 64
  WARMUP_METHOD: 'cosine'
  LARGE_FC_LR: False
  CHECKPOINT_PERIOD: 120
  LOG_PERIOD: 20
  EVAL_PERIOD: 10
  WEIGHT_DECAY: 1e-4
  WEIGHT_DECAY_BIAS: 1e-4
  BIAS_LR_FACTOR: 2

TEST:
  EVAL: True
  IMS_PER_BATCH: 256
  RE_RANKING: False
  WEIGHT: ''
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'

OUTPUT_DIR: './log/occluded_duke/exp125_pair_top_scrd'
