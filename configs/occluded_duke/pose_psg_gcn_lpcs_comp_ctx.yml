MODEL:
  PRETRAIN_PATH: 'pretrained/swin_tiny.pth'
  PRETRAIN_CHOICE: 'self'
  TRANSFORMER_TYPE: 'swin_tiny_patch4_window7_224'
  STRIDE_SIZE: [16, 16]
  JPM: False
  RE_ARRANGE: True
  SEMANTIC_WEIGHT: 0.2

  POSE_ENABLED: True
  POSE_DATA_DIR: 'data/occluded_duke'
  POSE_HEATMAP_SIZE: [96, 32]

  POSE_BACKBONE_PSG: True
  POSE_GLOBAL_PSG: True
  POSE_SKELETON_GCN: True
  POSE_GCN_HIDDEN: 256
  POSE_GCN_LAYERS: 2
  POSE_KP_WEIGHT_MODE: 'score'
  POSE_TEST_FEAT: 'cvk_residual'

  POSE_LPCS: True
  POSE_LPCS_WEIGHT: 0.5
  POSE_LPCS_WARMUP: 20
  POSE_LPCS_HIDDEN: 32
  POSE_LPCS_DELTA_SCALE: 0.5
  POSE_LPCS_HEAD_MODE: 'residual'
  POSE_LPCS_PAIR_MODE: 'all'
  POSE_LPCS_PAIR_TOP_RATIO: 1.0
  POSE_LPCS_RANK_MODE: 'all'
  POSE_LPCS_RANK_TOP_RATIO: 1.0
  POSE_LPCS_RANK_TAU: 8.0
  POSE_LPCS_CONTEXT_MODE: 'comp_ctx'

  POSE_LPCS_ST_LOW_THR: 0.3
  POSE_LPCS_ST_UPDATE_THR: 0.7
  POSE_LPCS_ST_MOM: 0.9
  POSE_LPCS_ST_MIN_COUNT: 1
  POSE_LPCS_ST_UPDATE_STOP_EPOCH: -1

INPUT:
  SIZE_TRAIN: [384, 128]
  SIZE_TEST: [384, 128]
  PROB: 0.5
  RE_PROB: 0.5
  PADDING: 10

DATASETS:
  NAMES: ('occluded_duke')
  ROOT_DIR: ('data')
  ROOT_TRAIN_DIR: ('../data')
  ROOT_VAL_DIR: ('../data')

DATALOADER:
  SAMPLER: 'softmax_triplet'
  NUM_INSTANCE: 4
  NUM_WORKERS: 8

SOLVER:
  OPTIMIZER_NAME: 'SGD'
  MAX_EPOCHS: 120
  BASE_LR: 0.0008
  IMS_PER_BATCH: 64
  LARGE_FC_LR: False
  CHECKPOINT_PERIOD: 120
  LOG_PERIOD: 20
  EVAL_PERIOD: 10
  SEED: 1234
  WARMUP_METHOD: 'cosine'
  WARMUP_EPOCHS: 20

TEST:
  EVAL: True
  IMS_PER_BATCH: 256
  RE_RANKING: False
  CVK_GLOBAL_WEIGHT: 1.0
  CVK_KP_WEIGHT: 1.0

OUTPUT_DIR: './log/occluded_duke/exp141_lpcs_comp_ctx'
