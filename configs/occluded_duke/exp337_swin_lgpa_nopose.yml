# exp337: Swin 纯 LGPA-D + 不注入 pose（ablation vs exp336）
# 问题：exp336 的 +1.7 是来自 CLIP 文本部位语义本身，还是 pose 注入(pose-bias+assign+visibility)?
# = exp336 完全相同，仅加 POSE_LGPA_NO_POSE=True(LGPA 收 heatmaps=None → 纯 CLIP-text 部位 cross-attn,无 pose)。
# 判据：同 ckpt test.py equal_concat vs global。仍 +1.7→CLIP 语义本身;~0→靠 pose 注入。
MODEL:
  PRETRAIN_HW_RATIO: 2
  PRETRAIN_CHOICE: 'self'
  PRETRAIN_PATH: 'pretrained/swin_tiny.pth'
  METRIC_LOSS_TYPE: 'triplet'
  IF_LABELSMOOTH: 'off'
  IF_WITH_CENTER: 'no'
  NAME: 'transformer'
  NO_MARGIN: True
  DEVICE_ID: ('0')
  TRANSFORMER_TYPE: 'swin_tiny_patch4_window7_224'
  STRIDE_SIZE: [16, 16]
  SEMANTIC_WEIGHT: 0.2
  WITH_CP: False
  POSE_ENABLED: True
  POSE_DATA_DIR: 'data/occluded_duke'
  POSE_HEATMAP_SIZE: [96, 32]
  POSE_BACKBONE_PSG: True
  POSE_PSG_STAGES: []
  POSE_PFM_HIDDEN: 64
  POSE_LGPA: True
  POSE_LGPA_CLIP_DIM: 512
  POSE_LGPA_NUM_HEADS: 8
  POSE_LGPA_POSE_TEMP: 1.0
  POSE_LGPA_ASSIGN_WEIGHT: 0.5
  POSE_LGPA_DETACH: True
  POSE_LGPA_NO_POSE: True         # ★ ablation: LGPA 收 heatmaps=None,无 pose-bias/assign/visibility
  POSE_TEST_FEAT: 'equal_concat'
  GLOBAL_LOSS_SCALE: 0.5
  POSE_LOWER_BODY_OCC: False
  POSE_PARALLEL_AUG: False
  POSE_OA_SD: False

INPUT:
  SIZE_TRAIN: [384, 128]
  SIZE_TEST: [384, 128]
  PROB: 0.5
  RE_PROB: 0.5
  PADDING: 10
  PIXEL_MEAN: [0.5, 0.5, 0.5]
  PIXEL_STD: [0.5, 0.5, 0.5]

DATASETS:
  NAMES: ('occluded_duke')
  ROOT_DIR: ('data')

DATALOADER:
  SAMPLER: 'softmax_triplet'
  NUM_INSTANCE: 4
  NUM_WORKERS: 8

SOLVER:
  OPTIMIZER_NAME: 'SGD'
  MAX_EPOCHS: 120
  BASE_LR: 0.0008
  WARMUP_EPOCHS: 20
  IMS_PER_BATCH: 64
  WARMUP_METHOD: 'cosine'
  LARGE_FC_LR: False
  CHECKPOINT_PERIOD: 60
  LOG_PERIOD: 50
  EVAL_PERIOD: 10
  WEIGHT_DECAY: 1e-4
  WEIGHT_DECAY_BIAS: 1e-4
  BIAS_LR_FACTOR: 2

TEST:
  EVAL: True
  IMS_PER_BATCH: 64
  RE_RANKING: False
  WEIGHT: ''
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'

OUTPUT_DIR: './log/occluded_duke/exp337_swin_lgpa_nopose'
