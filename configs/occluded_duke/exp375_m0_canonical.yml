# exp375 PRSM Gate A: clean Swin-Tiny global-only isolation.
MODEL:
  PRETRAIN_HW_RATIO: 2
  PRETRAIN_CHOICE: 'self'
  PRETRAIN_PATH: 'pretrained/swin_tiny.pth'
  METRIC_LOSS_TYPE: 'triplet'
  IF_LABELSMOOTH: 'off'
  IF_WITH_CENTER: 'no'
  NAME: 'transformer'
  NO_MARGIN: True
  DEVICE_ID: ('0')
  TRANSFORMER_TYPE: 'swin_tiny_patch4_window7_224'
  STRIDE_SIZE: [16, 16]
  SEMANTIC_WEIGHT: 0.2
  WITH_CP: False

  POSE_ENABLED: True
  POSE_DATA_DIR: 'data/occluded_duke'
  POSE_HEATMAP_SIZE: [96, 32]
  POSE_BACKBONE_PSG: True
  POSE_PSG_STAGES: []
  POSE_USE_TARGET_HEATMAP: True

  POSE_PRSM: True
  POSE_PRSM_NUM_PARTS: 6
  POSE_PRSM_STATE_DIM: 128
  POSE_PRSM_RETENTION_INIT: 0.95
  POSE_PRSM_RES_SCALE_INIT: 0.001
  POSE_PRSM_ROUTING: 'parts'
  POSE_PRSM_POSE_SOURCE: 'canonical'
  POSE_PRSM_BIDIRECTIONAL: True

  POSE_PBSR: False
  POSE_LGPA: False
  POSE_SKELETON_GCN: False
  POSE_PPA: False
  POSE_VCSR: False
  POSE_STRUCTURAL_ROUTING: False
  POSE_CLIP_ID_PROMPT: False
  POSE_ADDITIVE_ADAPTER: False
  POSE_PATCH_EMBED: False
  POSE_PROMPT: False
  POSE_TEST_FEAT: 'global'
  GLOBAL_LOSS_SCALE: 1.0
  POSE_LOWER_BODY_OCC: False
  POSE_PARALLEL_AUG: False
  POSE_OA_SD: False

INPUT:
  SIZE_TRAIN: [384, 128]
  SIZE_TEST: [384, 128]
  PROB: 0.5
  RE_PROB: 0.5
  PADDING: 10
  PIXEL_MEAN: [0.5, 0.5, 0.5]
  PIXEL_STD: [0.5, 0.5, 0.5]

DATASETS:
  NAMES: ('occluded_duke')
  ROOT_DIR: ('data')

DATALOADER:
  SAMPLER: 'softmax_triplet'
  NUM_INSTANCE: 4
  NUM_WORKERS: 8

SOLVER:
  OPTIMIZER_NAME: 'SGD'
  MAX_EPOCHS: 120
  BASE_LR: 0.0008
  WARMUP_EPOCHS: 20
  IMS_PER_BATCH: 64
  WARMUP_METHOD: 'cosine'
  LARGE_FC_LR: False
  CHECKPOINT_PERIOD: 20
  LOG_PERIOD: 50
  EVAL_PERIOD: 10
  WEIGHT_DECAY: 1e-4
  WEIGHT_DECAY_BIAS: 1e-4
  BIAS_LR_FACTOR: 2
  SEED: 1234
  AMP_INIT_SCALE: 1024.0

TEST:
  EVAL: True
  IMS_PER_BATCH: 64
  RE_RANKING: False
  WEIGHT: ''
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'

OUTPUT_DIR: './log/occluded_duke/exp375_m0_canonical_s1234'
