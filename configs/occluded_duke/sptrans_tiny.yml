MODEL:
  PRETRAIN_HW_RATIO: 2
  METRIC_LOSS_TYPE: 'triplet'
  IF_LABELSMOOTH: 'off'
  IF_WITH_CENTER: 'no'
  NAME: 'transformer'
  NO_MARGIN: True
  DEVICE_ID: ('0')
  TRANSFORMER_TYPE: 'sptrans_tiny_patch4_window7_224'
  WITH_CP: False
  STRIDE_SIZE: [16, 16]

  PRETRAIN_CHOICE: 'self'
  PRETRAIN_PATH: "pretrained/swin_tiny.pth"
  SEMANTIC_WEIGHT: 0.2

  POSE:
    ENABLE: true
    CFG: pose/config_vispredict.py
    CKPT: pretrained/best_coco_AP_epoch_210.pth
    SAVE_VIS: false
    N_KPTS: 17
    BRANCH_STAGE: 1
    FUSE_STAGE: 1
    FUSION_MODE: mul
    USE_VIS: false
    HM_NORM: none
    DETACH: true
    SCALE: 0.3
    LOCAL_LOSS_WEIGHT: 0.5

  SPTRANS:
    ADAPTIVE_SEM: true
    PART_ROUTING: true
    N_PARTS: 5
    PART_TEMP: 0.1
    LOSS_STRATEGY: 'part_expert'
    PART_EXPERT: true
    MID_ROUTING: true
    MOE_BOTTLENECK: 64
    EXPERT_BOTTLENECK: 128
    PART_LOSS_WEIGHT: 0.2

  FREEZE:
    ENABLE: false
    RULES:
      - MODULE: base.pose_predictor
        START_EPOCH: 1
        END_EPOCH: 10
        SET_EVAL: True

INPUT:
  SIZE_TRAIN: [384, 128]
  SIZE_TEST:  [384, 128]
  PROB: 0.5
  RE_PROB: 0.5
  PADDING: 10
  PIXEL_MEAN: [0.5, 0.5, 0.5]
  PIXEL_STD: [0.5, 0.5, 0.5]

DATASETS:
  NAMES: ('occluded_duke')
  ROOT_DIR: ('data')

DATALOADER:
  SAMPLER: 'softmax_triplet'
  NUM_INSTANCE: 4
  NUM_WORKERS: 8

SOLVER:
  OPTIMIZER_NAME: 'SGD'
  MAX_EPOCHS: 120
  BASE_LR: 0.0008
  WARMUP_EPOCHS: 20
  IMS_PER_BATCH: 64
  WARMUP_METHOD: 'cosine'
  LARGE_FC_LR: False
  CHECKPOINT_PERIOD: 120
  LOG_PERIOD: 20
  EVAL_PERIOD: 10
  WEIGHT_DECAY:  1e-4
  WEIGHT_DECAY_BIAS: 1e-4
  BIAS_LR_FACTOR: 2

TEST:
  EVAL: True
  IMS_PER_BATCH: 256
  RE_RANKING: False
  WEIGHT: ''
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'

OUTPUT_DIR: './log/occluded_duke/sptrans_tiny'
