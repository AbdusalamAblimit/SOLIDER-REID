MODEL:
  PRETRAIN_HW_RATIO: 2
  METRIC_LOSS_TYPE: 'triplet'
  IF_LABELSMOOTH: 'off'
  IF_WITH_CENTER: 'no'
  NAME: 'transformer'
  NO_MARGIN: True
  DEVICE_ID: ('0')
  TRANSFORMER_TYPE: 'pams_tiny_patch4_window7_224'
  WITH_CP: False
  STRIDE_SIZE: [16, 16]

  PRETRAIN_CHOICE: 'self'
  PRETRAIN_PATH: "pretrained/swin_tiny.pth"

  POSE:
    ENABLE: True
    CFG: pose/config_vispredict.py
    CKPT: pretrained/best_coco_AP_epoch_210.pth
    N_KPTS: 17
    DETACH: True

  PAMS:
    ENABLE: True
    N_PARTS: 5
    MSF_TARGET_HW: [24, 8]
    MSF_OUT_DIM: 768
    BPA_WEIGHT: 1.0
    PUSH_WEIGHT: 0.1
    ID_WEIGHT: 1.0
    TRI_WEIGHT: 1.0
    VIS_THRESHOLD: 0.5
    LOSS_STRATEGY: 'pams'

INPUT:
  SIZE_TRAIN: [384, 128]
  SIZE_TEST:  [384, 128]
  PROB: 0.5
  RE_PROB: 0.5
  PADDING: 10
  PIXEL_MEAN: [0.5, 0.5, 0.5]
  PIXEL_STD: [0.5, 0.5, 0.5]

DATASETS:
  NAMES: ('market1501')
  ROOT_DIR: ('path/to/market1501/dataset')

DATALOADER:
  SAMPLER: 'softmax_triplet'
  NUM_INSTANCE: 4
  NUM_WORKERS: 8

SOLVER:
  OPTIMIZER_NAME: 'SGD'
  MAX_EPOCHS: 120
  BASE_LR: 0.0008
  WARMUP_EPOCHS: 20
  IMS_PER_BATCH: 64
  WARMUP_METHOD: 'cosine'
  LARGE_FC_LR: False
  CHECKPOINT_PERIOD: 120
  LOG_PERIOD: 20
  EVAL_PERIOD: 10
  WEIGHT_DECAY:  1e-4
  WEIGHT_DECAY_BIAS: 1e-4
  BIAS_LR_FACTOR: 2

TEST:
  EVAL: True
  IMS_PER_BATCH: 256
  RE_RANKING: False
  WEIGHT: ''
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'
  ENABLED_FEATS: ('global', 'parts')

OUTPUT_DIR: './log/market/pams_tiny'
