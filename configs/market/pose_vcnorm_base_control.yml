MODEL:
  PRETRAIN_HW_RATIO: 2
  PRETRAIN_CHOICE: 'self'
  PRETRAIN_PATH: 'pretrained/swin_base.pth'
  METRIC_LOSS_TYPE: 'triplet'
  IF_LABELSMOOTH: 'off'
  IF_WITH_CENTER: 'no'
  NAME: 'transformer'
  NO_MARGIN: True
  DEVICE_ID: ('0')
  TRANSFORMER_TYPE: 'swin_base_patch4_window7_224'
  STRIDE_SIZE: [16, 16]
  SEMANTIC_WEIGHT: 0.2
  WITH_CP: True
  POSE_ENABLED: True
  POSE_DATA_DIR: 'data/market1501'
  POSE_HEATMAP_SIZE: [96, 32]
  POSE_BACKBONE_PSG: True
  POSE_PFM_HIDDEN: 64
  POSE_LGPA: True
  POSE_LGPA_CLIP_DIM: 512
  POSE_LGPA_NUM_HEADS: 8
  POSE_LGPA_POSE_TEMP: 1.0
  POSE_LGPA_ASSIGN_WEIGHT: 0.5
  POSE_LGPA_DETACH: True
  POSE_SKELETON_GCN: True
  POSE_GCN_LAYERS: 2
  POSE_GCN_HIDDEN: 512
  POSE_PSG_STAGES: [-2, -1]
  POSE_TEST_FEAT: 'equal_concat'
  GLOBAL_LOSS_SCALE: 0.5
  POSE_LOWER_BODY_OCC: True
  POSE_PARALLEL_AUG: True
  POSE_OA_SD: True
  POSE_OA_SD_WEIGHT: 1.0
  POSE_OA_SD_EMA_DECAY: 0.999
  # ===== SINGLE-VARIABLE CONTROL for exp328 VC-Norm (codex High-2) =====
  # IDENTICAL to configs/market/pose_vcnorm_base.yml EXCEPT POSE_VCNORM=False.
  # PLBOA (POSE_LOWER_BODY_OCC) stays True so this matches the VC-Norm config in
  # every way but the VC-Norm switch. The VC-Norm net gain is measured ONLY
  # against this control, NOT against the original exp260b 88.0 (that run had
  # PLBOA=False, so it is a different baseline).
  POSE_VCNORM: False
  POSE_VCNORM_WEIGHT: 0.5
  POSE_VCNORM_WARMUP: 20
  POSE_VCNORM_VIS_THR: 0.3
  POSE_VCNORM_HIDDEN: 64
  POSE_VCNORM_GAIN_SCALE: 1.0
  POSE_VCNORM_MODULE: True

INPUT:
  SIZE_TRAIN: [384, 128]
  SIZE_TEST: [384, 128]
  PROB: 0.5
  RE_PROB: 0.5
  PADDING: 10
  PIXEL_MEAN: [0.5, 0.5, 0.5]
  PIXEL_STD: [0.5, 0.5, 0.5]

DATASETS:
  NAMES: ('market1501')
  ROOT_DIR: ('data')

DATALOADER:
  SAMPLER: 'softmax_triplet'
  NUM_INSTANCE: 4
  NUM_WORKERS: 8

SOLVER:
  OPTIMIZER_NAME: 'SGD'
  MAX_EPOCHS: 120
  BASE_LR: 0.0004
  WARMUP_EPOCHS: 20
  IMS_PER_BATCH: 64
  WARMUP_METHOD: 'cosine'
  LARGE_FC_LR: False
  CHECKPOINT_PERIOD: 20
  LOG_PERIOD: 20
  EVAL_PERIOD: 10
  WEIGHT_DECAY: 1e-4
  WEIGHT_DECAY_BIAS: 1e-4
  BIAS_LR_FACTOR: 2

TEST:
  EVAL: True
  IMS_PER_BATCH: 64
  RE_RANKING: False
  WEIGHT: ''
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'

OUTPUT_DIR: './log/market1501/exp328_vcnorm_control'
